[project]
name = "llm-from-scratch"
version = "0.1.0"
description = "Building an LLM from scratch"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "numpy",
    "tiktoken>=0.14.0",
    "jupyterlab>=4.0",
    "matplotlib>=3.7.1",
    "tensorflow>=2.16.2 ; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "tensorflow>=2.18.0 ; platform_machine != 'x86_64' or sys_platform != 'darwin'",
    "tqdm>=4.66.1",
    "pandas>=2.2.1",
    "psutil>=5.9.5",
]

# PyTorch wheel selection:
#   - macOS (Apple Silicon): default PyPI wheel, includes MPS GPU support.
#   - Linux (devserver, NVIDIA GPU): CUDA wheel from the PyTorch index.
# `uv sync` / `uv pip install` on each machine resolves the right one automatically.
#
# Pinned to the cu126 build specifically: devserver's GPU is a Pascal-era
# GTX 1070 (compute capability 6.1). `--torch-backend=auto` / the newest
# cu13x wheels drop kernels for CC < 7.5 and silently fail at runtime
# ("no kernel image is available for execution on the device"). cu126 still
# ships sm_61 kernels. Re-check this if upgrading the GPU or torch major version.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
